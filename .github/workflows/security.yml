name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit security scan (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit

      - name: Run Bandit scan
        continue-on-error: true
        run: python -m bandit -r graft.py tests -ll
